# Local stand: MQTT broker (Mosquitto) + backend (SQLite, no MongoDB).
# Run from the testbench folder:
#   docker compose -f docker-compose.dev.yml up --build
# Then (optionally, to emulate a device over MQTT):  python device_simulator.py --broker localhost:1883
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  backend:
    build: ..
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/school_env.db
      MQTT_URL: mqtt://mosquitto:1883
      SIMULATE_DEVICES: "false"   # set to "true" to use the built-in simulator instead of MQTT
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: ["backend_data:/data"]
    depends_on: [mosquitto]
volumes:
  backend_data:
